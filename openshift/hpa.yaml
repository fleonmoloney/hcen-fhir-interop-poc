apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hcen-fhir-interop-poc
  labels:
    app: hcen-fhir-interop-poc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hcen-fhir-interop-poc
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
